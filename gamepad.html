<script type="text/javascript" src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/nipplejs/0.9.0/nipplejs.min.js"></script>

<script>
function $(id){
    return document.getElementById(id);
}
function disableTouch(){
    event.preventDefault();
    return false;
}
function onKeyDown(element){
    event.preventDefault();
    element.classList.add('act');
    sendMessage('BTN_DOWN;' + element.dataset.code);
    return false;
}
function onKeyUp(element){
    event.preventDefault();
    element.classList.remove('act');
    sendMessage('BTN_LIFT;' + element.dataset.code);
    return false;
}

function initLefyJoy(){
    const options = {
        zone: $('left-joy'),
        mode: "static",
        size: 160,
        color: "#333",
        position: { left: '50%', top: '50%' },
    };
    const manager = nipplejs.create(options);
    manager.on('start', function(evt, nipple) {
        $('left-joy').classList.add("act");
    }).on('move', function(evt, nipple) {
        sendJoystick(nipple.vector, true);
    }).on('end', function(evt, nipple) {
        $('left-joy').classList.remove("act");
        sendMessage('JOYSTICK;true;0.0;0.0');
    });
}

function initRightJoy(){
    const options = {
        zone: $('right-joy'),
        mode: "static",
        size: 140,
        position: {left: '50%', top: '50%'},
        color: 'blue'
    };
    const manager = nipplejs.create(options);
    manager.on('start', function(evt, nipple) {
        $('right-joy').classList.add("act");
    }).on('move', function(evt, nipple) {
        sendJoystick(nipple.vector, false);
    }).on('end', function(evt, nipple) {
        $('right-joy').classList.remove("act");
        sendMessage('JOYSTICK;false;0.0;0.0');
    });
}

function sendJoystick(pos, left){
    if (mScreenRotated) {
        sendMessage('JOYSTICK;' + left + ';' + (-pos.y.toFixed(4)) + ";" + pos.x.toFixed(4));
    } else {
        sendMessage('JOYSTICK;' + left + ';' + pos.x.toFixed(4) + ";" + pos.y.toFixed(4));
    }
    
}

window.onload = function () {
    initLefyJoy();
    initRightJoy();
};
</script>

<script>

console.log(window.location.search);
const urlParams = new URLSearchParams(window.location.search);
const ip = urlParams.get('ip') || '192.168.43.19';
const port = urlParams.get('port') || '42291';

const mSocket = new WebSocket("ws://" + ip + ":" + port);

mSocket.addEventListener("open", function (event) {
    toast("✅ 游戏连接成功");
});

mSocket.addEventListener("message", function (event) {
    console.log("📩 收到消息:", event.data);
});

var mSocketError = false;
mSocket.addEventListener("error", function (event) {
    mSocketError = true;
});
mSocket.addEventListener("close", function (event) {
    if (mSocketError) {
        toast("❌ 游戏连接失败");
    } else {
        toast("❌ 游戏连接已关闭，请重新扫码连接");
    }
    
});

function sendMessage(msg){
    if (mSocket.readyState === WebSocket.OPEN) {
        mSocket.send(msg);
        toast(msg);
    }
}

function toast(msg){
    $('tips').innerText = msg;
}

window.addEventListener('resize', function(){
    window.location.reload();
});

const width = window.innerWidth ? window.innerWidth : document.body.clientWidth;
const height = window.innerHeight ? window.innerHeight : document.body.clientHeight;
var mScreenRotated = width < height;
if (mScreenRotated) {
    // 竖屏 -> 旋转成横屏
    $('mouseOpt').style.position = 'fixed';
    $('mouseOpt').style.left = '50%';
    $('mouseOpt').style.top = '50%';
    $('mouseOpt').style.width = height + 'px';
    $('mouseOpt').style.height = width + 'px';
    $('mouseOpt').style.transformOrigin = '0 0';
    $('mouseOpt').style.transform = 'rotate(90deg) translate(-50%, -50%)';
    $('left-joy').style.transform = 'rotate(-90deg)';
    $('right-joy').style.transform = 'rotate(-90deg)';
}

toast("游戏连接中...");

</script>
